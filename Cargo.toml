[package]
name = "ssdgraph"
version = "0.1.0"
edition = "2021"
description = "A property graph database that lives on SSD, with a tiny in-memory lookup cache."

[dependencies]
anyhow = "1"
axum = "0.7"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
