<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ssdgraph — dashboard</title>
  <link rel="stylesheet" href="/dashboard/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>ssdgraph</h1>
    <input id="search" class="search" type="search" placeholder="search labels, keys, string values…" autocomplete="off" />
    <select id="label-filter" class="filter">
      <option value="">all labels</option>
    </select>
    <button id="reload" class="btn" title="re-fetch /api/graph">↻</button>
    <span id="stats" class="stats">loading…</span>
  </header>
  <main class="layout">
    <section id="cy" class="canvas"></section>
    <aside id="details" class="details">
      <p class="hint">click a node or edge to inspect it</p>
    </aside>
  </main>
  <script src="/dashboard/vendor/cytoscape.min.js"></script>
  <script src="/dashboard/app.js"></script>
</body>
</html>
